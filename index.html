<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Turnamen</title>
    <!-- index.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Turnamen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- FIREBASE SDK & INITIALIZATION -->
    <!-- Taruh tepat di atas <script src="script.js"></script> -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration dari foto kamu
        const firebaseConfig = {
            apiKey: "AIzaSyAFhpL0M5JfsdS71hlVU7xBK0lnno9tGlw",
            authDomain: "e-sport-lppm-ri.firebaseapp.com",
            databaseURL: "https://e-sport-lppm-ri-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "e-sport-lppm-ri",
            storageBucket: "e-sport-lppm-ri.firebasestorage.app",
            messagingSenderId: "960625264175",
            appId: "1:960625264175:web:20729654a789a3627568da",
            measurementId: "G-ZGZ4X7FRHZ"
        };

        // Inisialisasi Firebase & Realtime Database
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Ekspor ke window agar bisa dipakai di script.js
        window.fbDB = database;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbOnValue = onValue;
    </script>

    <script src="script.js"></script>
</body>
</html>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- HEADER / NAVBAR -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Logo & Nama Turnamen -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <img src="logo.jpg" alt="Logo Turnamen" class="w-10 h-10 object-contain rounded-lg bg-slate-800 p-1 border border-slate-700">
                <div>
                    <input type="text" id="tournamentName" value="E-SPORT LPPM RI" class="bg-transparent font-bold text-lg md:text-xl text-white focus:outline-none border-b border-transparent hover:border-slate-600 focus:border-amber-500 transition-colors w-full md:w-auto" readonly>
                    <p class="text-xs text-slate-400">Sistem Manajemen Turnamen Multi-Format</p>
                </div>
            </div>

            <!-- Tombol Navigasi / Admin Login -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <button id="btnAdminAuth" type="button" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-4 py-2 rounded-lg font-semibold text-sm transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-lock"></i>
                    <span id="adminAuthText">Login Admin</span>
                </button>
            </div>
        </div>
    </header>

    <!-- DASHBOARD UTAMA -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- BARIS KONTROL (FORMAT & TIM) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            
            <!-- PANEL SETTING TURNAMEN -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <h2 class="text-base font-bold text-amber-400 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> Pengaturan Turnamen
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Format Turnamen</label>
                        <select id="tournamentFormat" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="single_elimination">Single Elimination (Gugur)</option>
                            <option value="double_elimination">Double Elimination</option>
                            <option value="round_robin">Round Robin (Liga)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Daftar Tim (1 per baris)</label>
                        <textarea id="teamsInput" rows="6" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-amber-500 font-mono" placeholder="Tim Alpha&#10;Tim Beta&#10;Tim Gamma&#10;Tim Delta&#10;Tim Epsilon&#10;Tim Zeta&#10;Tim Eta&#10;Tim Theta"></textarea>
                    </div>

                    <button id="btnGenerate" type="button" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-amber-400 py-2.5 rounded-lg font-bold text-sm transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-diagram-project"></i> Generate Bagan
                    </button>
                </div>
            </div>

            <!-- PANEL BAGAN / SCHEDULE -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm overflow-hidden flex flex-col">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                    <h2 class="text-base font-bold text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-sitemap"></i> Display Pertandingan
                    </h2>
                    <span id="statusBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-medium">Ready</span>
                </div>

                <div id="bracketContainer" class="flex-1 overflow-x-auto overflow-y-auto min-h-[350px]">
                    <div class="flex items-center justify-center h-full text-slate-500 text-sm">
                        Klik "Generate Bagan" untuk memulai turnamen.
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL LOGIN ADMIN -->
    <div id="loginModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md shadow-2xl relative">
            <h3 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                <i class="fa-solid fa-user-shield text-amber-400"></i> Login Admin
            </h3>
            <p class="text-xs text-slate-400 mb-6">Masukkan kata sandi admin untuk mengedit skor pertandingan.</p>

            <form id="adminLoginForm">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Password</label>
                    <input type="password" id="adminPassword" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500" placeholder="••••••••" required>
                    <p id="loginError" class="text-xs text-rose-500 mt-1 hidden">Password salah!</p>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" id="btnCloseLoginModal" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-sm hover:bg-slate-700">Batal</button>
                    <button type="submit" id="btnLoginSubmit" class="px-4 py-2 bg-amber-500 text-slate-950 font-semibold rounded-lg text-sm hover:bg-amber-600">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL INPUT SKOR -->
    <div id="scoreModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-amber-400"></i> Update Skor Pertandingan
            </h3>

            <input type="hidden" id="modalMatchId">

            <div class="space-y-4 mb-6">
                <div class="flex items-center justify-between gap-3 bg-slate-800 p-3 rounded-lg">
                    <span id="modalTeam1Name" class="text-sm font-semibold text-white truncate max-w-[120px]">Tim 1</span>
                    <input type="number" id="scoreTeam1" min="0" class="w-16 bg-slate-900 border border-slate-700 rounded text-center py-1 text-amber-400 font-bold focus:outline-none focus:border-amber-500">
                </div>

                <div class="text-center text-xs text-slate-500 font-bold">VS</div>

                <div class="flex items-center justify-between gap-3 bg-slate-800 p-3 rounded-lg">
                    <span id="modalTeam2Name" class="text-sm font-semibold text-white truncate max-w-[120px]">Tim 2</span>
                    <input type="number" id="scoreTeam2" min="0" class="w-16 bg-slate-900 border border-slate-700 rounded text-center py-1 text-amber-400 font-bold focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button type="button" id="btnCloseScoreModal" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-sm hover:bg-slate-700">Batal</button>
                <button type="button" id="btnSaveScore" class="px-4 py-2 bg-amber-500 text-slate-950 font-semibold rounded-lg text-sm hover:bg-amber-600">Simpan</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
